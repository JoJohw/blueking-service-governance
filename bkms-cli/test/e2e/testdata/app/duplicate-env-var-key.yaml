# 错误用例：环境变量 key 重复
name: my-app
type: trpc

buildConfig:
  sourceType: imageRegistry
  imageBuildConfig:
    name: example.com/myns/my-app

appModelSpec:
  trpcSpec:
    language: go
    fileName: trpc_go.yaml
    filePath: /app/conf
  envVars:
    - key: FOO
      value: bar
    - key: FOO
      value: baz
