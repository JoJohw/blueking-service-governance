name: NodePortService
version: v1.0.0
displayName: NodePortService
description: 使用 NodePort 的形式暴露应用服务
scopeType: global
isBuiltin: true
properties:
- name: port
  type: INT
  defaultValue: 8080
  description: service端口
- name: protocol
  type: STRING
  defaultValue: TCP
  description: 协议
- name: targetPort
  type: INT
  defaultValue: 80
  description: 目标端口
patchers:
- |-
  spec:
    template:
      spec:
        containers:
          - name: "{{ .bkmsContainerName }}"
            ports:
            - containerPort: {{ .targetPort }}
              protocol: "{{ .protocol }}"
              name: "port-{{ .targetPort }}"
specs:
- |-
  apiVersion: v1
  kind: Service
  metadata:
    name: "{{ .name }}"
  spec:
    type: NodePort
    selector:
      app.kubernetes.io/name: "{{ .bkmsAppName }}"
    ports:
    - port: {{ .port }}
      targetPort: "port-{{ .targetPort }}"
