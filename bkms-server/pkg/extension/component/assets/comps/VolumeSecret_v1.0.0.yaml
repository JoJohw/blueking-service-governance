name: VolumeSecret
version: v1.0.0
displayName: VolumeSecret
description: 将 K8S 集群中的 Secret 资源挂载到应用中
scopeType: global
isBuiltin: true
properties:
- name: path
  type: STRING
  defaultValue: '{{ .path }}'
  description: 挂载路径
- name: secretName
  type: STRING
  defaultValue: '{{ .name }}'
  description: secret名称
patchers:
- |-
  spec:
    template:
      spec:
        volumes:
          - name: "{{ .name }}"
            secret:
              secretName: "{{ .secretName }}"
        containers:
          - name: "{{ .bkmsContainerName }}"
            volumeMounts:
            - name: "{{ .name }}"
              mountPath: "{{ .path }}"
specs: []
