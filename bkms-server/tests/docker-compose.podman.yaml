# Podman-only overrides for the self-contained API test stack.
#
# Keep the default docker-compose.yaml Docker-compatible. Use this file with
# podman compose when running the stack in a rootless Podman environment.

services:
  rabbitmq:
    # podman rootless 下，镜像里 VOLUME /var/lib/rabbitmq 首次启动会被拷贝到匿名
    # named volume，拷贝后属主经过 uid namespace 映射会落到非 rabbitmq(999) 的 subuid，
    # 导致容器内 rabbitmq 进程读 .erlang.cookie 时报 eacces，broker BOOT FAILED。
    # 通过 userns_mode=keep-id:uid=999,gid=999 把容器内 999 直接映射到宿主当前用户，规避该问题。
    userns_mode: "keep-id:uid=999,gid=999"
