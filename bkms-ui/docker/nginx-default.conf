# 容器内 Vite SPA 静态站点（监听 5000，与原先 targetPort 一致）
server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # 若镜像含 ngx_http_gzip_static_module 且构建产物含 .gz，可取消注释以降低 CPU
    # gzip_static on;

    # 禁止公网访问 source map（即使构建误产出 .map）
    location ~* \.map$ {
        return 404;
    }

    # 禁止访问隐藏路径（误打包 .env、.git 等）；保留 ACME well-known
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 仅 Vite 构建产物目录（hash 资源）长期缓存；add_header 不继承 server，须在本块写全安全头
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include security_headers.conf;
    }

    # SPA：$uri 命中则返回该文件，否则回退 index.html；与「仅 /assets/ 长缓存」一致，根目录静态文件走 no-cache
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        include security_headers.conf;
    }

    # 显式处理 index.html（含直接请求 /index.html）；避免与 try_files 内部重定向行为混淆
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include security_headers.conf;
    }
}
