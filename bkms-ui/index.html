<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/src/assets/logo.png" type="image/png" />
  <title>服务治理 | 蓝鲸智云</title>
  <!-- 层序（低→高），未分层的 uno 工具类最高；!important 段反序，boost 专收压组件库 !important 的声明（见 theme/patches/boost.css） -->
  <style>@layer bkms-boost, bkms-reset, bkms-vendor, bkms-patches;</style>
  <script>
    ; (function () {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
      const isDark = setting === 'dark' || (prefersDark && setting !== 'light')
      if (isDark) document.documentElement.classList.toggle('dark', true)
      /* 多主题：色值覆盖位见 src/styles/theme/themes/，按 [data-theme] 生效 */
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
    })()
  </script>
</head>

<body class="font-sans">
  <div id="app"></div>
  <script>
    var BK_LOGIN_URL = '%BK_LOGIN_URL%'
    var BK_API_PREFIX = '%BK_API_PREFIX%'
    var BK_SHARED_RES_BASE_JS_URL = '%BK_SHARED_RES_BASE_JS_URL%'
    var BK_DEVOPS = '%BK_DEVOPS%'
    var BK_BCS = '%BK_BCS%'
    var BK_MONITOR = '%BK_MONITOR%'
    var BK_POLARIS_URL = '%BK_POLARIS_URL%'
    var BK_DOC_URL = '%BK_DOC_URL%'
    var BK_BKMS_APP_VERSION = '__BK_BKMS_APP_VERSION__'
  </script>
  <script type="module" src="/src/main.ts"></script>
  <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
</body>

</html>
