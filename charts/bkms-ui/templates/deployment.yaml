apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bkms-ui.fullname" . }}
  labels:
    {{- include "bkms-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bkms-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bkms-ui.labels" . | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command or args specified, use the default entrypoint of the bkms-ui image.
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
